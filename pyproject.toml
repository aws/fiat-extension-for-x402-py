[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiat-extension-for-x402"
version = "0.1.0"
description = "Python SDK for the x402 payment protocol's fiat-currency extension"
license = { text = "Apache-2.0" }
authors = [{ name = "Amazon Web Services" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "boto3>=1.34.0",
    "cryptography>=42.0.0",
    # x402 protocol core: resource server, facilitator, HTTP middleware and the
    # scheme contracts implemented here. 2.20 introduced payment flows.
    "x402>=2.20.0,<3",
]

[project.optional-dependencies]
flask = ["x402[flask]>=2.20.0,<3"]
fastapi = ["x402[fastapi]>=2.20.0,<3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "moto",
    "respx>=0.21.0",
    "build",
    "flask>=3.0",
    "fastapi>=0.115",
]

[project.urls]
Homepage = "https://github.com/aws/fiat-extension-for-x402-py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fiat_extension_x402"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]
