[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiat-extension-for-x402"
version = "1.0.0"
description = "Python SDK for the x402 payment protocol's fiat-currency extension"
license = { text = "Apache-2.0" }
authors = [{ name = "Amazon Web Services" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic>=2.0",
    "boto3>=1.34.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
flask = ["flask>=3.0"]
fastapi = ["fastapi>=0.110"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "moto",
    "respx>=0.21.0",
    "build",
]

[project.urls]
Homepage = "https://github.com/aws/fiat-extension-for-x402-py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests that hit the live Agent Pay endpoint (deselected by default; run with -m e2e)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fiat_extension_x402"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]
