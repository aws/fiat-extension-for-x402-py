[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fiat-extension-for-x402"
version = "1.0.0"
description = "AWS Marketplace Agentic Commerce payment schemes for the x402 protocol"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Amazon Web Services" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["x402", "payments", "aws", "aws-marketplace", "agentic-commerce"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.14.0",
    "boto3>=1.34.0",
    "cryptography>=50.0.0",
    # x402 protocol core: resource server, facilitator, HTTP middleware and the
    # scheme contracts implemented here. 2.20 introduced payment flows.
    "x402>=2.20.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "moto",
    "respx>=0.21.0",
    "build",
    "flask>=3.0",
    "fastapi>=0.115",
]

[project.urls]
Homepage = "https://github.com/aws/fiat-extension-for-x402-py"
Source = "https://github.com/aws/fiat-extension-for-x402-py"
Issues = "https://github.com/aws/fiat-extension-for-x402-py/issues"
Changelog = "https://github.com/aws/fiat-extension-for-x402-py/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fiat_extension_x402"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]
