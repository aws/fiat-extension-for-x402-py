name: Release

# Publishing a GitHub release uploads that tag to PyPI with PyPI Trusted
# Publishing, so there are no stored credentials. The PyPI publisher trusts this
# file name and the `pypi` environment; renaming either breaks publishing. See
# "Releasing" in CONTRIBUTING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml.
  UV_VERSION: "0.12.23"

jobs:
  # Re-run CI on the tagged commit. A squash merge can differ from what the
  # pull request's checks tested.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check that the release tag is on main.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          uv run --no-project --python 3.12 --with packaging==26.3 python - <<'PY'
          import os
          import sys
          import tomllib

          from packaging.version import Version

          tag = os.environ["TAG"]
          marked_prerelease = os.environ["PRERELEASE"] == "true"
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          with open("src/fiat_extension_x402/__init__.py") as f:
              init_lines = f.read().splitlines()

          errors = []
          if str(Version(version)) != version:
              errors.append(f"{version} is not a normalized PEP 440 version")
          if tag != f"v{version}":
              errors.append(f"Tag {tag} does not match pyproject.toml version {version}")
          if f'__version__ = "{version}"' not in init_lines:
              errors.append(f"__version__ does not match pyproject.toml version {version}")
          # PyPI accepts each version once, so a final version published by
          # mistake from a pre-release cannot be taken back.
          if Version(version).is_prerelease != marked_prerelease:
              if marked_prerelease:
                  errors.append(f"Release is marked pre-release but {version} is a final version")
              else:
                  errors.append(f"{version} is a pre-release; mark the GitHub release as pre-release")
          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY
      - run: uv build
      - name: Check the distributions
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/python -c "import fiat_extension_x402; print(fiat_extension_x402.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only downloads and uploads, so nothing else runs with the id-token
  # permission.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fiat-extension-for-x402/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing; nothing else needs a credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
