name: Release

# Publishing a GitHub release uploads that tag to PyPI with PyPI Trusted
# Publishing, so there are no stored credentials. The PyPI publisher trusts this
# file name and the `pypi` environment; renaming either breaks publishing.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml.
  UV_VERSION: "0.12.23"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check that the release tag is on main.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Check the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$TAG" = "v$version" ] \
            || { echo "::error::Tag $TAG does not match pyproject.toml version $version"; exit 1; }
          grep -qx "__version__ = \"$version\"" src/fiat_extension_x402/__init__.py \
            || { echo "::error::__version__ does not match pyproject.toml version $version"; exit 1; }
      - run: uv build
      - name: Check the distributions
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/python -c "import fiat_extension_x402; print(fiat_extension_x402.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only downloads and uploads, so nothing else runs with the id-token
  # permission.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fiat-extension-for-x402/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
